name: commerce-lab

services:
  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

# Single-node orientation using the official image's default configuration.
# No persistent volume: removing the container removes this lab's Kafka data.
# This is not the multi-broker durability/failover lab.
